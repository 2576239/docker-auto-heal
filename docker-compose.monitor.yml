# version: '3.8'

services:
# 1.数据采集员: 负责把你电脑的 CPU/内存数据吐出来
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: always

# 2.记录员：去采集 node-exporter 的数据
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml # 挂载配置文件
    restart: always

#3.UI设计师：负责把数据画成大屏
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always