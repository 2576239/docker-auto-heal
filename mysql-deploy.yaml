apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
spec:
  replicas: 1  #只需要一个mysql
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest  #用镜像源拉取
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-storage
          mountPath: /usr/share/nginx/html  #把硬盘挂在mysql 存储的目录
      volumes:
      - name: nginx-storage
        emptyDir: {}
        # persistentVolumeClaim:
        #   claimName: mysql-pv-claim  #告诉 pod：用刚才写的那份mysql-pvc申请表