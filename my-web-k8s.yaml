# 1.定义 Deployment （包工头） 
apiVersion: apps/v1           #告诉k8s，用的是apps/v1 版本语法
kind: Deployment              #要创建的资源类型是Deployment
metadata:                     #元数据   
  name: my-web-deploy         #名字
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-web
  template:
    metadata:
      labels:
        app: my-web
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: my-custom-html

---
#定义 Service
apiVersion: v1
kind: Service
metadata:
  name: my-web-service
spec:
  type: NodePort
  selector:
    app: my-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080                       